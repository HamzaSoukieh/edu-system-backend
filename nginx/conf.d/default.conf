limit_req_zone $binary_remote_addr zone=auth_standard:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_issuance:10m rate=5r/m;

upstream backend {
    server backend:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    server_tokens off;

    client_max_body_size 12m;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /auth/login {
        limit_req zone=auth_standard burst=5 nodelay;
        proxy_pass http://backend;
    }

    location = /auth/signup {
        limit_req zone=auth_issuance burst=3 nodelay;
        proxy_pass http://backend;
    }

    location = /auth/password/forgot {
        limit_req zone=auth_issuance burst=3 nodelay;
        proxy_pass http://backend;
    }

    location = /auth/password/reset {
        limit_req zone=auth_standard burst=5 nodelay;
        proxy_pass http://backend;
    }

    location = /auth/otp/verify {
        limit_req zone=auth_standard burst=5 nodelay;
        proxy_pass http://backend;
    }

    location = /auth/otp/resend {
        limit_req zone=auth_issuance burst=3 nodelay;
        proxy_pass http://backend;
    }

    location / {
        # Default proxy buffering preserves the request bytes, including Stripe's raw webhook body.
        proxy_pass http://backend;
    }
}
