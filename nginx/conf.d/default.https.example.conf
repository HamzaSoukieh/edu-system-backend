limit_req_zone $binary_remote_addr zone=auth_standard:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_issuance:10m rate=5r/m;

upstream backend {
    server backend:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Enable only after HTTPS and renewal have been confirmed working:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 12m;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";

    location = /auth/login {
        limit_req zone=auth_standard burst=5 nodelay;
        proxy_pass http://backend;
    }

    location = /auth/signup {
        limit_req zone=auth_issuance burst=3 nodelay;
        proxy_pass http://backend;
    }

    location = /auth/password/forgot {
        limit_req zone=auth_issuance burst=3 nodelay;
        proxy_pass http://backend;
    }

    location = /auth/password/reset {
        limit_req zone=auth_standard burst=5 nodelay;
        proxy_pass http://backend;
    }

    location = /auth/otp/verify {
        limit_req zone=auth_standard burst=5 nodelay;
        proxy_pass http://backend;
    }

    location = /auth/otp/resend {
        limit_req zone=auth_issuance burst=3 nodelay;
        proxy_pass http://backend;
    }

    location / {
        # This includes /health and /stripe/webhook without authentication rate limiting.
        proxy_pass http://backend;
    }
}
