services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${SELFHOSTED_ENV_FILE:-.env.selfhosted}
    expose:
      - "5000"
    volumes:
      - uploads_data:/app/uploads
      - private_storage_data:/app/storage
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    init: true
    networks:
      - private
      - backend_egress

  email-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run worker:email
    env_file:
      - ${SELFHOSTED_ENV_FILE:-.env.selfhosted}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    networks:
      - private
      - backend_egress

  mongo:
    image: mongo:7
    env_file:
      - ${SELFHOSTED_ENV_FILE:-.env.selfhosted}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1 --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "quit(db.adminCommand('ping').ok ? 0 : 2)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - private

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - private

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - private
      - edge

  certbot:
    image: certbot/certbot:latest
    profiles:
      - tools
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - edge

volumes:
  mongo_data:
  uploads_data:
  private_storage_data:
  redis_data:

networks:
  private:
    driver: bridge
    internal: true
  backend_egress:
    driver: bridge
  edge:
    driver: bridge
