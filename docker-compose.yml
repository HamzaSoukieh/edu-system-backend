services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    env_file:
      - .env.docker
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo
      - redis

  email-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev:worker:email
    env_file:
      - .env.docker
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  stripe-cli:
    image: stripe/stripe-cli:latest
    env_file:
      - .env.docker
    command: listen --forward-to http://backend:5000/stripe/webhook
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
